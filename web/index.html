// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, options) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));
    x.send(file.slice(i * s.part, Math.min(file.size, (i + 1) * s.part)));
  });
  let next = 0;
  const worker = async () => {
    while (next < s.parts) {
      const i = next++;
      for (let tries = 0; ; tries++) {
        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}
function sendFile(f, who, options) {
  if (S.status.upload_part_mb && f.file.size > S.status.upload_part_mb * 1048576) return sendBig(f, who, options);
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(), fd = new FormData();
    fd.append("file", f.file); fd.append("options", JSON.stringify(options)); fd.append("creator", who);
    x.open("POST", "/api/upload");
    x.upload.onprogress = e => { if (e.lengthComputable) { f.pct = Math.round(e.loaded / e.total * 100); drawAtt(); } };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) return ok();
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      fail(new Error(typeof d === "string" ? d : "Upload failed"));
    };
    x.onerror = () => fail(new Error("Upload failed. Check your connection."));
    x.send(fd);
  });
}
async function makeClips() {
  const A = att();
  if (A.busy) return;
  const typed = $("#url")?.value.trim();
  if (typed && looksLink(typed) && !isChannel(typed)) { clearTimeout(linkTimer); takeLink(A, typed, $("#url")); }
  if (A.links.some(l => l.state === "wait")) {   // still looking a link up: start as soon as it is found
    A.queued = true; drawAtt();
    toast("Finding the video first. Clipping starts as soon as it's found.");
    return;
  }
  if (!canGo(A)) {
    toast(A.note || "Paste a YouTube, Twitch or Kick video link, or add a video file first.", "bad");
    $("#url")?.focus();
    return;
  }
  A.busy = true; drawAtt();
  let started = 0, failed = 0;
  const who = targetCreator(), opts = jobOptions();
  for (const l of A.links.filter(x => x.state === "ok")) {
    l.sending = true; drawAtt();
    try { await send("/api/jobs", {url: l.url, options: opts, creator: who}); l.state = "done"; started++; }
    catch (e) { l.state = "bad"; l.msg = e.message; failed++; }
    l.sending = false; drawAtt();
  }
  for (const f of A.files) {
    f.state = "up"; f.pct = 0; drawAtt();
    try { await sendFile(f, who, opts); f.state = "done"; started++; }
    catch (e) { f.state = "error"; f.err = e.message; failed++; }
    drawAtt();
  }
  A.links = A.links.filter(l => l.state !== "done");
  A.files = A.files.filter(f => { if (f.state === "done") { URL.revokeObjectURL(f.src); return false; } return true; });
  A.busy = false; drawAtt();
  if (started) {
    toast(`${started === 1 ? "Your video is" : started + " videos are"} being clipped now.`, "ok");
    if (!failed && S.view === "overview") go(who ? "c:" + who : "library"); else tick();
  } else if (failed) toast("Nothing was started. The reason is shown on the video.", "bad");
}

function drawJobs() {

function barChart(daily) {
  const W = 720, H = 230, pl = 30, pb = 28, pt = 12, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
  const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});

      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No clips in the last 14 days yet</text>` : "";

}

function tokenChart(daily) {
  const W = 1000, H = 220, pl = 64, pb = 26, pt = 10, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(...daily.map(d => d.tokens), 1), top = peak * 1.15, cw = (W - pl) / n, bw = Math.min(14, cw - 6);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = top * i / 3; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(Math.round(v))}</text>`; }
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.tokens.toLocaleString()} tokens in ${d.calls} call${d.calls === 1 ? "" : "s"}</title><rect class="b1" x="${cx - bw / 2}" y="${y(d.tokens)}" width="${bw}" height="${Math.max(0, ch * d.tokens / top)}" rx="3"/></g>`;
    if ((n - 1 - i) % 5 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.tokens) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No AI used in the last 30 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI tokens used per day, last 30 days">${g}${none}</svg>`;
}

  const total = rows.reduce((a, r) => a + r[1], 0) || 1;

    <div class="track"><i style="width:${Math.max(2, r[1] / total * 100)}%"></i></div></div>`).join("")}</div>` : `<p class="help">Nothing yet.</p>`;
}

      <div class="tile"><i>${ic("clock")}</i><b>${(k.today_calls || 0).toLocaleString()}</b><span>AI calls today</span></div>
      <div class="tile"><i>${ic("chart")}</i><b>${fmtK(k.today_tokens)}</b><span>Tokens today</span></div>
      <div class="tile"><i>${ic("scissors")}</i><b>${(k.calls_total || 0).toLocaleString()}</b><span>AI calls in total</span></div>
      <div class="tile"><i>${ic("receipt")}</i><b>${fmtK(k.tokens_total)}</b><span>Tokens in total</span></div></div>
    <div class="card"><div class="card-head"><div><h2>Tokens per day</h2><p class="sub">Last 30 days. Your AI provider bills you for these directly.</p></div></div>${tokenChart(k.daily || [])}</div>
    <div class="split">
      <div class="card"><div class="card-head"><div><h2>What it was used for</h2><p class="sub">By kind of AI work, all time</p></div></div>${hbars(k.by_purpose || [])}</div>

      ${k.recent.map(u => `<tr><td class="sub">${when(u.t)}</td><td>${esc(u.purpose)}</td><td>${esc(u.creator_name || "None")}</td><td class="sub">${esc(u.where || "")}</td><td class="num">${(u.tokens || 0).toLocaleString()}</td></tr>`).join("")}</table></div>`

/* ============================================================ calendar */
async function loadCalendar() {
  const box = $("#calendar");
  if (box && !S.calEvents) {
    box.innerHTML = `<div class="card" style="padding:32px;text-align:center;color:var(--dim)">${ic("clock")} Loading content calendar…</div>`;
  }
  try {
    const data = await api("/api/calendar/events");
    S.calData = data;
    S.calEvents = data.events || [];
  } catch (err) {
    if (box) box.innerHTML = `<div class="err" style="margin:20px">Could not load calendar events: ${esc(err.message)}</div>`;
    return;
  }
  drawShell();
  drawCalendar();
}

function drawCalendar() {
  const el = $("#calendar");
  if (!el) return;
  if (!S.calEvents) {
    el.innerHTML = `<div class="card" style="padding:32px;text-align:center;color:var(--dim)">${ic("clock")} Loading content calendar…</div>`;
    return;
  }

  S.calDate = S.calDate || new Date();
  S.calView = S.calView || "month";
  S.calFilter = S.calFilter || "all";
  S.calStatus = S.calStatus || "all";

  const curr = S.calDate;
  const year = curr.getFullYear();
  const month = curr.getMonth();
  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const monthLabel = `${monthNames[month]} ${year}`;

  const events = (S.calEvents || []).filter(e => {
    if (S.calFilter !== "all" && e.platform !== S.calFilter) return false;
    if (S.calStatus !== "all" && e.status !== S.calStatus) return false;
    return true;
  });

  const totalSched = (S.calEvents || []).filter(e => e.status === "scheduled").length;
  const totalPosted = (S.calEvents || []).filter(e => e.status === "posted").length;
  const totalFailed = (S.calEvents || []).filter(e => e.status === "failed").length;

  const platforms = [
    {id: "all", name: "All Channels"},
    {id: "youtube", name: "YouTube Shorts"},
    {id: "instagram", name: "Instagram Reels"},
    {id: "tiktok", name: "TikTok"},
    {id: "facebook", name: "Facebook Reels"},
    {id: "threads", name: "Threads"},
    {id: "pinterest", name: "Pinterest"},
    {id: "twitter", name: "X (Twitter)"},
    {id: "linkedin", name: "LinkedIn"}
  ];

  let bodyHtml = "";

  if (S.calView === "month") {
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);

    let cellsHtml = "";
    const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="cal-day-name">${d}</div>`).join("");

    for (let i = firstDay - 1; i >= 0; i--) {
      const dNum = daysInPrevMonth - i;
      cellsHtml += `<div class="cal-day other-month"><div class="cal-day-num" style="color:var(--dim)">${dNum}</div></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const isToday = dateStr === todayStr;

      const dayEvents = events.filter(e => {
        const t = e.due_at || e.posted_at || e.created;
        if (!t) return false;
        const eDate = new Date(t * 1000).toISOString().slice(0, 10);
        return eDate === dateStr;
      });

      const dayEventsHtml = dayEvents.map(e => {
        const timeStr = (e.due_at || e.posted_at) ? new Date((e.due_at || e.posted_at) * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
        const statusCls = e.status === "posted" ? "status-posted" : e.status === "failed" ? "status-failed" : "status-scheduled";
        const statusBadge = e.status === "posted" ? `<span class="pill ok" style="font-size:10px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px">${ic("check")} Posted</span>`
          : e.status === "failed" ? `<span class="pill warn" style="font-size:10px;padding:1px 6px;display:inline-flex;align-items:center;gap:3px">${ic("warn")} Error</span>`
          : `<span class="pill" style="font-size:10px;padding:1px 6px;background:rgba(255,138,69,0.12);color:var(--orange, #FF8A45);border:1px solid rgba(255,138,69,0.25);display:inline-flex;align-items:center;gap:3px">${ic("clock")} ${timeStr || "Scheduled"}</span>`;

        return `
          <div class="cal-card ${statusCls}" data-act="opencalevent" data-id="${esc(e.id)}" title="${esc(e.title || e.hook)}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
              <span style="display:inline-flex;align-items:center;gap:4px">
                ${brandLogo(e.platform, 14)}
                <b style="font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">${esc(e.account_name || e.platform)}</b>
              </span>
              ${e.score ? `<span class="badge ${scoreCls(e.score)}" style="font-size:9px;padding:1px 5px">${e.score}</span>` : ""}
            </div>
            <div style="font-weight:600;color:var(--text);line-height:1.2;font-size:11px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">
              ${esc(e.title || e.hook || "Clip")}
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:2px">
              ${statusBadge}
              ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" class="lnk" style="font-size:10px" onclick="event.stopPropagation()">${ic("upright")} Link</a>` : ""}
            </div>
          </div>`;
      }).join("");

      cellsHtml += `
        <div class="cal-day ${isToday ? "today" : ""}">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div class="cal-day-num" style="font-size:12px;font-weight:${isToday ? '800' : '600'};color:${isToday ? '#fff' : 'var(--text)'}">${d}</div>
            <button class="btn icon ghost sm" data-act="opencalschedule" data-date="${dateStr}" title="Schedule a clip on ${dateStr}" style="width:22px;height:22px;padding:0;font-size:12px;opacity:0.6">${ic("plus")}</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;flex:1 1 auto;overflow-y:auto">
            ${dayEventsHtml}
          </div>
        </div>`;
    }

    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
    const paddingNext = totalCells - (firstDay + daysInMonth);
    for (let p = 1; p <= paddingNext; p++) {
      cellsHtml += `<div class="cal-day other-month"><div class="cal-day-num" style="color:var(--dim)">${p}</div></div>`;
    }

    bodyHtml = `<div class="cal-grid">${dayHeaders}${cellsHtml}</div>`;
  } else {
    // Agenda View
    const sorted = [...events].sort((a, b) => (a.due_at || a.posted_at || 0) - (b.due_at || b.posted_at || 0));
    if (!sorted.length) {
      bodyHtml = `<div class="card" style="padding:40px;text-align:center;color:var(--dim)">
        <div style="margin-bottom:8px">${ic("calendar")}</div>
        <h3 style="margin:8px 0 4px 0;color:var(--text)">No clips scheduled</h3>
        <p class="sub">Pick a clip from your library or click "Schedule a Clip" above to add it to the calendar.</p>
        <button class="btn primary sm" data-act="opencalschedule" style="margin-top:12px">${ic("plus")} Schedule a Clip</button>
      </div>`;
    } else {
      bodyHtml = `
        <div style="display:flex;flex-direction:column;gap:12px">
          ${sorted.map(e => {
            const timeStr = (e.due_at || e.posted_at) ? new Date((e.due_at || e.posted_at) * 1000).toLocaleString([], {weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
            const isPosted = e.status === "posted";
            const isFailed = e.status === "failed";
            const statusBadge = isPosted ? `<span class="pill ok" style="font-size:11px;display:inline-flex;align-items:center;gap:4px">${ic("check")} Posted</span>`
              : isFailed ? `<span class="pill warn" style="font-size:11px;display:inline-flex;align-items:center;gap:4px">${ic("warn")} Error</span>`
              : `<span class="pill" style="font-size:11px;background:rgba(255,138,69,0.12);color:var(--orange, #FF8A45);border:1px solid rgba(255,138,69,0.25);display:inline-flex;align-items:center;gap:4px">${ic("clock")} Scheduled</span>`;

            return `
              <div class="card" style="padding:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-left:4px solid ${isPosted ? 'var(--green, #347A3D)' : isFailed ? 'var(--bad, #E53935)' : 'var(--orange, #FF8A45)'}">
                ${e.thumbnail_url ? `
                  <div style="position:relative;width:64px;height:96px;flex:none;border-radius:6px;overflow:hidden;background:#000">
                    <img src="${esc(e.thumbnail_url)}" alt="" style="width:100%;height:100%;object-fit:cover">
                    <button class="btn sm icon" data-act="opencalevent" data-id="${esc(e.id)}" style="position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;display:grid;place-items:center">${ic("play")}</button>
                  </div>` : `
                  <div style="width:64px;height:96px;flex:none;border-radius:6px;background:var(--muted);display:grid;place-items:center">
                    ${brandLogo(e.platform, 28)}
                  </div>`}
                <div style="flex:1 1 260px">
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
                    <span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600">
                      ${brandLogo(e.platform, 16)} ${esc(e.account_name || e.platform)}
                    </span>
                    ${statusBadge}
                    ${e.score ? `<span class="badge ${scoreCls(e.score)}" style="font-size:10px">${e.score} AI Score</span>` : ""}
                  </div>
                  <b style="font-size:15px;color:var(--text);display:block;margin-bottom:4px">${esc(e.title || e.hook || "Clip")}</b>
                  ${e.hook ? `<p style="font-size:12px;color:var(--dim);margin:0 0 6px 0">${esc(e.hook)}</p>` : ""}
                  <div style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:12px">
                    <span>${ic("clock")} ${timeStr}</span>
                    ${e.duration ? `<span>${fmt(e.duration)}</span>` : ""}
                    ${e.error ? `<span style="color:var(--bad)">${esc(e.error)}</span>` : ""}
                  </div>
                </div>
                <div class="row" style="gap:8px;flex:none;margin-left:auto">
                  ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" class="btn sm primary">${ic("upright")} Open Post</a>` : ""}
                  ${!isPosted ? `<button class="btn sm primary" data-act="calpostnow" data-id="${esc(e.id)}">${ic("send")} Post now</button>` : ""}
                  <a href="/api/calendar/google-url/${esc(e.id)}" target="_blank" rel="noopener" class="btn sm" title="Add to Google Calendar">${brandLogo("google", 14)} Google Cal</a>
                  <button class="btn sm icon ghost" data-act="opencalevent" data-id="${esc(e.id)}" title="View clip details">${ic("eye")}</button>
                  ${!isPosted ? `<button class="btn sm icon ghost" data-act="caldelete" data-id="${esc(e.id)}" title="Cancel scheduled post">${ic("trash")}</button>` : ""}
                </div>
              </div>`;
          }).join("")}
        </div>`;
    }
  }

  el.innerHTML = `
    <!-- Top Stats Banner -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin-bottom:16px">
      <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px">
        <div style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Scheduled Clips</div>
        <div style="font-size:24px;font-weight:800;color:var(--orange, #FF8A45);margin-top:2px">${totalSched}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:4px">${ic("clock")} In publishing queue</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px">
        <div style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Published Clips</div>
        <div style="font-size:24px;font-weight:800;color:var(--green, #347A3D);margin-top:2px">${totalPosted}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:4px">${ic("check")} Live on social media</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px">
        <div style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Active Channels</div>
        <div style="font-size:24px;font-weight:800;color:var(--text);margin-top:2px">${(S.calData?.accounts || []).length}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:4px">${ic("plug")} Connected accounts</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:center;gap:6px">
        <button class="btn sm primary" data-act="opencalschedule" style="justify-content:center;font-weight:700">${ic("plus")} Schedule a Clip</button>
        <a class="btn sm ghost" href="/api/calendar/feed.ics" download="clipsart-schedule.ics" style="justify-content:center;font-size:11px">${ic("calendar")} Sync iCal / Feed</a>
      </div>
    </div>

    <!-- Navigation & View Control Toolbar -->
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px">
        <h2 style="margin:0;font-size:18px;font-weight:800;color:var(--text);letter-spacing:-0.01em">${monthLabel}</h2>
        <div class="row" style="gap:4px">
          <button class="btn sm icon" data-act="calprev" title="Previous Month" aria-label="Previous Month">${ic("caret")}</button>
          <button class="btn sm" data-act="caltoday">Today</button>
          <button class="btn sm icon" data-act="calnext" title="Next Month" aria-label="Next Month" style="transform:rotate(180deg)">${ic("caret")}</button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <!-- View Toggle (Month vs Agenda) -->
        <div style="display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--bg)">
          <button class="btn sm ${S.calView === 'month' ? 'primary' : 'ghost'}" data-act="calsetview" data-v="month" style="border:none;border-radius:0;height:32px;padding:0 12px;font-size:12px">${ic("calendar")} Month</button>
          <button class="btn sm ${S.calView === 'agenda' ? 'primary' : 'ghost'}" data-act="calsetview" data-v="agenda" style="border:none;border-radius:0;height:32px;padding:0 12px;font-size:12px">${ic("sliders")} Agenda</button>
        </div>

        <!-- Status Filter -->
        <select id="cal_status_sel" style="height:32px;font-size:12px;padding:0 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card)">
          <option value="all" ${S.calStatus === 'all' ? 'selected' : ''}>All Statuses</option>
          <option value="scheduled" ${S.calStatus === 'scheduled' ? 'selected' : ''}>Scheduled</option>
          <option value="posted" ${S.calStatus === 'posted' ? 'selected' : ''}>Posted</option>
          <option value="failed" ${S.calStatus === 'failed' ? 'selected' : ''}>Errors</option>
        </select>
      </div>
    </div>

    <!-- Platform Filter Pills -->
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none">
      ${platforms.map(p => `
        <button class="btn sm ${S.calFilter === p.id ? 'primary' : 'ghost'}" data-act="calfilter" data-p="${esc(p.id)}" style="flex:none;height:30px;font-size:12px;padding:0 10px;display:inline-flex;align-items:center;gap:5px">
          ${p.id !== 'all' ? brandLogo(p.id, 14) : ''}
          <span>${esc(p.name)}</span>
        </button>
      `).join("")}
    </div>

    <!-- Main Calendar Area -->
    ${bodyHtml}
  `;

  const sel = $("#cal_status_sel");
  if (sel) {
    sel.onchange = (e) => {
      S.calStatus = e.target.value;
      drawCalendar();
    };
  }
}

function openCalEvent(id) {
  const e = (S.calEvents || []).find(x => x.id === id);
  if (!e) return;
  const isPosted = e.status === "posted";
  const isFailed = e.status === "failed";
  const isScheduled = e.status === "scheduled";
  const timeStr = (e.due_at || e.posted_at) ? new Date((e.due_at || e.posted_at) * 1000).toLocaleString([], {weekday: "long", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";

  const dlg = $("#formdlg");
  dlg.innerHTML = `
    <div class="dlg" style="max-width:540px;width:100%">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          ${brandLogo(e.platform, 20)}
          <h2 style="margin:0;font-size:16px">${esc(e.account_name || e.platform)}</h2>
          ${isPosted ? `<span class="pill ok" style="font-size:10px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px">${ic("check")} Posted</span>`
            : isFailed ? `<span class="pill warn" style="font-size:10px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px">${ic("warn")} Failed</span>`
            : `<span class="pill" style="font-size:10px;padding:2px 7px;background:rgba(255,138,69,0.12);color:var(--orange, #FF8A45);border:1px solid rgba(255,138,69,0.25);display:inline-flex;align-items:center;gap:4px">${ic("clock")} Scheduled</span>`}
        </div>
        <button class="btn icon ghost sm" type="button" data-act="closeform" aria-label="Close">${ic("x")}</button>
      </div>

      ${e.video_url ? `
        <div style="width:100%;background:#000;border-radius:8px;overflow:hidden;display:grid;place-items:center;margin-bottom:10px">
          <video controls playsinline src="${esc(e.video_url)}" style="max-height:300px;width:100%;object-fit:contain"></video>
        </div>` : ""}

      <div style="display:flex;flex-direction:column;gap:8px">
        <div>
          <b style="font-size:14px;color:var(--text)">${esc(e.title || "Scheduled Clip")}</b>
          ${e.hook ? `<p style="font-size:12px;color:var(--dim);margin:4px 0 0 0">${esc(e.hook)}</p>` : ""}
        </div>

        <div style="font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:4px;background:var(--bg);padding:10px;border-radius:6px;border:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between"><span>Time:</span> <b>${timeStr}</b></div>
          <div style="display:flex;justify-content:space-between"><span>Target Channel:</span> <b>${esc(e.platform)} (${esc(e.account_name)})</b></div>
          ${e.score ? `<div style="display:flex;justify-content:space-between"><span>AI Viral Score:</span> <b>${e.score}</b></div>` : ""}
          ${e.error ? `<div style="color:var(--bad)"><b>Error:</b> ${esc(e.error)}</div>` : ""}
        </div>
      </div>

      <div class="dlg-foot" style="margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" class="btn primary sm">${ic("upright")} View on ${esc(e.platform)}</a>` : ""}
        ${isScheduled ? `<button class="btn primary sm" data-act="calpostnow" data-id="${esc(e.id)}">${ic("send")} Post now</button>` : ""}
        <a href="/api/calendar/google-url/${esc(e.id)}" target="_blank" rel="noopener" class="btn sm">${brandLogo("google", 14)} Google Calendar</a>
        ${!isPosted ? `<button class="btn sm ghost" data-act="caldelete" data-id="${esc(e.id)}" style="color:var(--bad)">${ic("trash")} Cancel Post</button>` : ""}
        <button class="btn sm" type="button" data-act="closeform" style="margin-left:auto">Done</button>
      </div>
    </div>`;
  dlg.showModal();

function openCalSchedule(dateStr) {
  const doneClips = (S.jobs || []).flatMap(j => (j.clips || []).filter(c => c.status === "done").map(c => ({...c, jobId: j.id, jobName: j.meta?.name || j.title || "Video"})));
  const apiAccounts = (S.accounts || []).filter(a => a.has_api || (a.access_token && a.access_token !== "web"));

  const dlg = $("#formdlg");
  if (!doneClips.length) {
    dlg.innerHTML = `
      <div class="dlg" style="max-width:440px">
        <button class="x" type="button" data-act="closeform">${ic("x")}</button>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          ${ic("calendar")}
          <h2 style="margin:0">Schedule a Clip</h2>
        </div>
        <p class="help">You don't have any rendered clips yet. Upload a video on the Home screen or let Clipsart process your clips first.</p>
        <div class="dlg-foot">
          <button class="btn primary sm" type="button" data-act="closeform">Got it</button>
        </div>
      </div>`;
    dlg.showModal();
    return;
  }

  const defaultDateTime = dateStr ? `${dateStr}T12:00` : new Date(Date.now() + 3600000).toISOString().slice(0, 16);

  dlg.innerHTML = `
    <form id="calsched_form" method="dialog" class="dlg" style="max-width:520px;width:100%">
      <button class="x" type="button" data-act="closeform">${ic("x")}</button>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        ${ic("calendar")}
        <h2 style="margin:0">Schedule Clip to Calendar</h2>
      </div>
      <p class="help" style="margin-top:0">Pick a finished clip, select accounts, and choose when to automatically publish it.</p>

      <label class="f">Choose Clip
        <select id="cs_clip" required>
          ${doneClips.map(c => `<option value="${esc(c.jobId)}:${esc(c.id)}">${esc(c.title || c.hook || "Clip")} (${fmt(c.end - c.start)})</option>`).join("")}
        </select>
      </label>

      <div style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:4px 0">
        <div style="font-size:12px;font-weight:600;margin-bottom:8px">Select Destination Channels:</div>
        ${apiAccounts.length ? `
          <div class="row" style="gap:8px;flex-wrap:wrap">
            ${apiAccounts.map((a, i) => `<label class="ck" style="display:inline-flex;align-items:center;gap:6px">
              <input type="checkbox" name="cs_accs" value="${esc(a.id)}" ${i === 0 ? "checked" : ""}>
              ${brandLogo(a.platform, 14)}
              <span style="font-size:12px">${esc(a.name)}</span>
            </label>`).join("")}
          </div>` : `
          <p class="sub" style="margin:0;font-size:12px">No automated API accounts connected. Connect YouTube or Instagram in Settings to schedule background posting.</p>`}
      </div>

      <div class="two" style="margin-top:4px">
        <label class="f">Date & Time
          <input id="cs_time" type="datetime-local" value="${defaultDateTime}" required>
        </label>
        <div style="display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px;font-size:11px;color:var(--dim)">
          Device timezone: <b>${Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"}</b>
        </div>
      </div>

      <div class="dlg-foot" style="margin-top:16px">
        <button class="btn" type="button" data-act="closeform">Cancel</button>
        <button class="btn primary" type="submit" ${apiAccounts.length ? "" : "disabled"}>${ic("clock")} Schedule Post</button>
      </div>
    </form>`;

  $("#calsched_form").onsubmit = async (e) => {
    e.preventDefault();
    const clipVal = $("#cs_clip").value;
    if (!clipVal) return;
    const [jid, cid] = clipVal.split(":");
    const checked = [...dlg.querySelectorAll('input[name="cs_accs"]:checked')].map(i => i.value);
    if (!checked.length) return toast("Select at least one destination account.", "bad");
    const schedAt = $("#cs_time").value;
    if (!schedAt) return toast("Select a scheduled date and time.", "bad");

    try {
      await send("/api/calendar/schedule", {
        job: jid,
        clip: cid,
        accounts: checked,
        scheduled_at: schedAt,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"
      });
      dlg.close();
      toast("Clip added to content calendar!", "ok");
      await loadCalendar();
    } catch (err) {
      toast(err.message, "bad");
    }
  };

  dlg.showModal();
}

function paintThumbnail() {
  const canvas = $("#thumb-canvas"), ctx = canvas?.getContext("2d"), image = D.thumbBase;
  if (!ctx || !image) return;
  const scale = Math.max(canvas.width / image.width, canvas.height / image.height);
  const w = image.width * scale, h = image.height * scale;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
  const title = $("#thumb-title")?.value.trim();
  if (!title) return;
  const style = $("#thumb-style")?.value || "bold";
  const font = style === "clean" ? "600 56px Arial, sans-serif" : style === "neon" ? "900 64px Arial Black, Arial, sans-serif" : "900 68px Arial Black, Arial, sans-serif";
  ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const words = title.split(/\s+/), lines = []; let line = "";
  for (const word of words) { const test = line ? line + " " + word : word; if (line && ctx.measureText(test).width > 620 && lines.length < 2) { lines.push(line); line = word; } else line = test; }
  if (line) lines.push(line);
  if (lines.length > 2) lines.splice(2, lines.length - 2);
  const band = ctx.createLinearGradient(0, 760, 0, 1280); band.addColorStop(0, "rgba(0,0,0,0)"); band.addColorStop(1, "rgba(0,0,0,.82)");
  ctx.fillStyle = band; ctx.fillRect(0, 700, 720, 580);
  let size = style === "clean" ? 56 : style === "neon" ? 64 : 68; ctx.font = `${style === "clean" ? "600" : "900"} ${size}px ${style === "neon" ? "Arial Black, Arial" : "Arial"}`;
  const gap = size * 1.15, startY = 1120 - (lines.length - 1) * gap / 2;
  lines.forEach((text, i) => {
    const shown = text; while (ctx.measureText(shown).width > 650 && size > 38) { size -= 2; ctx.font = `${style === "clean" ? "600" : "900"} ${size}px Arial`; }
    ctx.lineWidth = style === "clean" ? 4 : 8; ctx.strokeStyle = "rgba(0,0,0,.9)"; ctx.lineJoin = "round";
    ctx.shadowColor = style === "neon" ? "#00E5FF" : "transparent"; ctx.shadowBlur = style === "neon" ? 22 : 0;
    ctx.fillStyle = style === "neon" ? "#B8FBFF" : "#FFFFFF"; ctx.strokeText(shown.toUpperCase(), 360, startY + i * gap, 660); ctx.fillText(shown.toUpperCase(), 360, startY + i * gap, 660);
    ctx.shadowBlur = 0;
  });
}

function bindTrimPreview() {

  video.addEventListener("timeupdate", () => {
    const lo = Number(video.dataset.trimStart), hi = Number(video.dataset.trimEnd);
    if (Number.isFinite(hi) && hi > lo && video.currentTime >= hi) video.currentTime = lo;
  });
}
function syncTrimPreview(input) {
  const start = $('#clipdlg [data-f="start"]'), end = $('#clipdlg [data-f="end"]');
  const inRange = $("#trim-in"), outRange = $("#trim-out"), video = $("#stage video");
  if (!start || !end || !inRange || !outRange) return;
  if (input === inRange) start.value = inRange.value;
  if (input === outRange) end.value = outRange.value;
  if (input === start) inRange.value = start.value;
  if (input === end) outRange.value = end.value;
  let a = Number(start.value), b = Number(end.value);
  if (b - a < 3) {
    if (input === inRange || input === start) { b = Math.min(Number(end.max), a + 3); end.value = String(b); outRange.value = String(b); }
    else { a = Math.max(Number(start.min), b - 3); start.value = String(a); inRange.value = String(a); }
  }
  if (video) {
    const base = Number(video.dataset.baseStart || 0);
    video.dataset.trimStart = String(Math.max(0, a - base));
    video.dataset.trimEnd = String(Math.max(0, b - base));
    if (input === outRange || input === end) {
      video.currentTime = Math.max(0, Number(video.dataset.trimEnd) - 0.2);
    } else {
      video.currentTime = Number(video.dataset.trimStart);
    }
  }
}

document.addEventListener("keydown", e => {
  const dlg = $("#clipdlg");
  if (!dlg || !dlg.open) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
  const video = $("#stage video");
  if (!video) return;
  if (e.code === "Space") {
    e.preventDefault();
    if (video.paused) video.play(); else video.pause();
  } else if (e.key === "ArrowLeft" || e.key === "j" || e.key === "J") {
    e.preventDefault();
    video.currentTime = Math.max(0, video.currentTime - (e.shiftKey ? 0.2 : 1.0));
  } else if (e.key === "ArrowRight" || e.key === "l" || e.key === "L") {
    e.preventDefault();
    video.currentTime = Math.min(video.duration || 9999, video.currentTime + (e.shiftKey ? 0.2 : 1.0));
  } else if (e.key === "i" || e.key === "I") {
    e.preventDefault();
    const base = Number(video.dataset.baseStart || 0);
    const startInput = $('#clipdlg [data-f="start"]');
    if (startInput) {
      const t = Math.max(0, (base + video.currentTime)).toFixed(2);
      startInput.value = t;
      syncTrimPreview(startInput);

    e.preventDefault();
    const base = Number(video.dataset.baseStart || 0);
    const endInput = $('#clipdlg [data-f="end"]');

      const filters = {
        none: 'none',
        warm: 'sepia(0.28) saturate(1.3) brightness(1.04)',
        vivid: 'contrast(1.25) saturate(1.45) brightness(1.02)',
        mono: 'grayscale(1) contrast(1.2)',
        vintage: 'sepia(0.45) contrast(1.1) brightness(0.92) saturate(1.15)'
      };
      vid.style.filter = filters[eff] || 'none';
      vid.classList.toggle('anim-pulse', anim === 'pulse');
    }

    // 4. Logo overlay live update
    const logo = dlg.querySelector('#live-logo-overlay');
    const scale = dlg.querySelector('[data-f="overlay_scale"]')?.value;
    const ox = dlg.querySelector('[data-f="overlay_x"]')?.value;
    const oy = dlg.querySelector('[data-f="overlay_y"]')?.value;
    if (logo && scale !== undefined && ox !== undefined && oy !== undefined && logo.getAttribute('src')) {
      logo.style.display = 'block';
      logo.style.width = (Number(scale) * 100).toFixed(1) + '%';
      logo.style.left = (Number(ox) * 100).toFixed(1) + '%';
      logo.style.top = (Number(oy) * 100).toFixed(1) + '%';
    }

    // 5. Resolution badge update
    const resSel = dlg.querySelector('[data-f="resolution"]');
    const hudRes = dlg.querySelector('#hud-res');
    if (resSel && hudRes) {
      const is4k = resSel.value === '4k';
      hudRes.textContent = is4k ? '4K UHD' : resSel.value === '720p' ? '720p HD' : '1080p HD';
      hudRes.className = 'hud-res ' + (is4k ? 'res-4k' : '');
    }
  };

  dlg.addEventListener("input", update);
  dlg.addEventListener("change", update);

  const vid = dlg.querySelector('#stage-video') || dlg.querySelector('#stage video');
  const hudTime = dlg.querySelector('#hud-time');
  if (vid && hudTime) {
    vid.addEventListener("timeupdate", () => {
      const cur = vid.currentTime || 0;
      const dur = vid.duration || (Number(c.end) - Number(c.start)) || 0;
      const fmt = s => {
        const m = Math.floor(s / 60);
        const sec = (s % 60).toFixed(1);
        return `${String(m).padStart(2, '0')}:${sec.padStart(4, '0')}`;
      };
      hudTime.textContent = `${fmt(cur)} / ${fmt(dur)}`;
    });
  }

  update();
}

/* ============================================================ render + polling */
function render() {
  drawShell(); drawJobs(); drawStream(); drawSelBar();
  if (S.view === "overview") drawOverview();
  if (S.view === "calendar") drawCalendar();
  if ($("#clog")) drawLog();
  if (D.jid) drawClipDlg(false);
}
async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 20000;
    S.syncV = got.v;
    if (!fresh) {                                   // nothing of ours changed on the server
      if (S.view === "overview" && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null) S.status.unread = got.unread;
    if (S.view === "overview") { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});
window.addEventListener("focus", () => { if (!document.hidden) tick(); });
function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"));
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

      } catch (err) {
        toast(err.message, "bad");

        b.disabled = false;

      return;

        toast(err.message, "bad");
      } finally {
        b.disabled = false;
      }
      return;
    }
    if (a === "cloudexport") {

        const res = await api(`/api/cloud-sync/export/${D.jid}/${D.cid}`, {method:"POST"});

      } catch (err) {
        toast(err.message, "bad");

      }

    if (a === "quickshare") {
      const pf = d.pf, j = jobOf(D.jid), c = j?.clips.find(x => x.id === D.cid);

      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {}
      if (c.file) {
        const aDl = document.createElement("a");

        facebook: "https://www.facebook.com/reels/create/",
        threads: "https://www.threads.net/",
        pinterest: "https://www.pinterest.com/pin-builder/",
        twitter: "https://x.com/compose/post?text=" + encodeURIComponent(text.slice(0, 270)),
        linkedin: "https://www.linkedin.com/feed/?shareActive=true&text=" + encodeURIComponent(text.slice(0, 1000))
      };
      const pfNames = {youtube:"YouTube Shorts", instagram:"Instagram Reels", tiktok:"TikTok", facebook:"Facebook Reels", threads:"Threads Video", pinterest:"Pinterest Video Pins", twitter:"X (Twitter)", linkedin:"LinkedIn Video"};
      if (urls[pf]) window.open(urls[pf], "_blank");
      toast(`Caption copied & video downloading! Opening ${pfNames[pf] || pf} studio...`, "ok");
      return;
    }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "remake") {

        body[i.dataset.f] = i.type === "checkbox" ? i.checked : ["number", "range"].includes(i.type) ? Number(i.value) : i.value;
      });
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "preview") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => {
        body[i.dataset.f] = i.type === "checkbox" ? i.checked : ["number", "range"].includes(i.type) ? Number(i.value) : i.value;
      });
      b.disabled = true; b.textContent = "Making preview…";
      try {
        const r = await send(`/api/jobs/${D.jid}/clips/${D.cid}/preview`, body);
        $("#stage").innerHTML = `<video src="${esc(r.file)}?v=${Date.now()}" controls autoplay playsinline aria-label="Preview of your edits"></video>`;
        bindTrimPreview(); toast("Preview ready. Your finished clip has not been changed.", "ok");
      } finally { b.disabled = false; b.innerHTML = `${ic("play")}Preview edits`; }

      D.cliptab = d.t;

      Object.entries(panes).forEach(([k, el]) => { if (el) el.style.display = k === d.t ? "flex" : "none"; });

    if (a === "setstylepreset") {
      const st = d.style;

    if (a === "copytitle") {

      return;

    if (a === "copycaption") {
      const desc = $('#clipdlg [data-f="description"]')?.value || "";

      }
      return;
    }
    if (a === "postnow" || a === "postqueue" || a === "postschedule") {

        if (a === "calprev") {

      return drawCalendar();

      S.calDate = new Date();
      return drawCalendar();

      S.calView = d.v;

});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("CLIPSART_link");
    if (link) { sessionStorage.removeItem("CLIPSART_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { try { S.status = await api("/api/status"); drawShell(); if (S.view === "overview") drawOverview(); checkNew(); } catch {} }, 15000);
})();
